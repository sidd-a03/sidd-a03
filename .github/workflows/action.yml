name: generate animation

on:
  schedule:
    - cron: "20 0 * * *"   # just after midnight UTC
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: generate snake (emerald palette)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#0F7A55&color_dots=#EBEDF0,#C6F0DD,#7FDDB6,#10B981,#0B6B4B
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#D4A24C&color_dots=#161B22,#0E3A2C,#0F6B4A,#10B981,#6EE7B7

      - name: git-profile-koi
        continue-on-error: true
        uses: yalongwastaken/git-koi@v1.0.2
        with:
          body: white
          output-dir: dist

      - name: generate repo galaxy
        continue-on-error: true
        run: node scripts/galaxy.mjs ${{ github.repository_owner }} dist/galaxy.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: generate metrics dashboard
        continue-on-error: true
        run: node scripts/metrics.mjs ${{ github.repository_owner }} dist/metrics.svg
        env:
          # optional: add a METRICS_TOKEN secret (classic PAT, read:user) to count private contributions too
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: push outputs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
