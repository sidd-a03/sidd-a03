name: generate profile visuals

on:
  schedule:
    - cron: "20 0 * * *"   # just after midnight UTC
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - run: mkdir -p dist

      - name: git-profile-koi
        continue-on-error: true
        uses: yalongwastaken/git-koi@v1.0.2
        with:
          body: white
          output-dir: dist

      - name: generate repo galaxy
        continue-on-error: true
        run: node scripts/galaxy.mjs ${{ github.repository_owner }} dist/galaxy.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: generate metrics dashboard
        continue-on-error: true
        run: node scripts/metrics.mjs ${{ github.repository_owner }} dist/metrics.svg
        env:
          # optional: add a METRICS_TOKEN secret (classic PAT, read:user) to count private contributions too
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: generate contribution city
        continue-on-error: true
        run: node scripts/city.mjs ${{ github.repository_owner }} dist/city.svg
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: push outputs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
